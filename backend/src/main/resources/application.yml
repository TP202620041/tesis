# Configuracion comun a todos los perfiles.
# Perfil activo por defecto: local (ver application-local.yml).
# Sobrescribe con: SPRING_PROFILES_ACTIVE=dev
spring:
  application:
    name: viasegura
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo administra Flyway; Hibernate solo valida que el
      # mapeo de entidades coincida con las tablas creadas por las migraciones.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  # SMTP para notificaciones por email (US-16/US-21). Por defecto apunta a
  # Mailhog (docker-compose, sin auth/TLS); en prod se inyecta por entorno.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

# Almacenamiento de fotos (US-05 reportes, US-30 perfil). Filesystem local en
# desarrollo. Las fotos se separan en dos subdirectorios de `fotos-dir` segun
# su visibilidad (ver FotoStorageService):
#   <fotos-dir>/reportes -> servido como estatico PUBLICO en `fotos-url`
#   <fotos-dir>/perfiles -> servido SOLO al dueno por `fotos-perfil-url`
app:
  storage:
    fotos-dir: ${FOTOS_DIR:./uploads/fotos}
    # Prefijo publico de las fotos de reporte (evidencia visible en el mapa).
    fotos-url: /media/fotos
    # Endpoint autenticado de las fotos de perfil (dato personal).
    fotos-perfil-url: /api/perfiles/fotos
  # Notificaciones al ciudadano (US-16/US-21).
  notificaciones:
    email-remitente: ${NOTIF_FROM:no-reply@viasegura.pe}
    # Suscripciones Web Push (NC-07).
    push:
      # Lista blanca de servicios de push (contra SSRF cuando haya envio
      # real, US-21), separados por coma. "*.dominio" admite subdominios.
      hosts-permitidos: ${PUSH_HOSTS_PERMITIDOS:fcm.googleapis.com,*.push.services.mozilla.com,*.notify.windows.com,web.push.apple.com}
      # Tope de suscripciones por usuario: al superarlo se borra la menos
      # recientemente registrada.
      max-por-usuario: ${PUSH_MAX_POR_USUARIO:10}
  # CORS: el frontend es una PWA Next.js desplegada como proyecto
  # independiente, en otro origen. Lista de origenes permitidos separados
  # por coma; en dev, el servidor de desarrollo de Next (puerto 3000).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Parametros de seguridad / JWT (leidos por JwtService)
security:
  jwt:
    # Secreto Base64 (>= 256 bits). En prod se inyecta por variable de entorno.
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMDEyMzQ1Njc4OQ==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
  error:
    include-message: always
