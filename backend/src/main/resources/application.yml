# Configuracion comun a todos los perfiles.
# Perfil por defecto: local (ver application-local.yml). `mvn spring-boot:run`
# lo activa de forma explicita (pom.xml); otro perfil con
# -Dspring-boot.run.profiles=dev o, al correr el jar, SPRING_PROFILES_ACTIVE.
# La imagen Docker fija SPRING_PROFILES_ACTIVE=prod.
spring:
  application:
    name: viasegura
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo administra Flyway; Hibernate solo valida que el
      # mapeo de entidades coincida con las tablas creadas por las migraciones.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  # SMTP del adaptador `smtp` de correo (app.correo.tipo, DEP-08). Por
  # defecto apunta a Mailhog (docker-compose, sin auth/TLS); los IT lo
  # cambian a GreenMail. En produccion el correo sale por HTTP (`resend`) y
  # este bloque no se usa.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # Timeouts en ms (DEP-02). JavaMail espera indefinidamente por
          # defecto: un SMTP colgado retendria para siempre uno de los pocos
          # hilos del executor asincrono que envia los correos.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Almacenamiento de fotos (US-05 reportes, US-30 perfil). Las fotos se separan
# segun su visibilidad (ver FotoStorageService), y las URL son las mismas con
# cualquier adaptador:
#   reportes -> PUBLICAS en `fotos-url`/reportes/<uuid>.jpg (WebMvcConfig)
#   perfiles -> SOLO al dueno en `fotos-perfil-url`/<uuid>.jpg (PerfilFotoController)
app:
  storage:
    # Adaptador (DEP-12): `local` (filesystem, desarrollo y tests) o `s3`
    # (Cloudflare R2 en produccion; un emulador S3 en la CI).
    tipo: ${FOTOS_ALMACEN:local}
    # Solo `local`: <fotos-dir>/reportes y <fotos-dir>/perfiles.
    fotos-dir: ${FOTOS_DIR:./uploads/fotos}
    # Prefijo publico de las fotos de reporte (evidencia visible en el mapa).
    fotos-url: /media/fotos
    # Endpoint autenticado de las fotos de perfil (dato personal).
    fotos-perfil-url: /api/perfiles/fotos
    # Solo `s3`: dos buckets PRIVADOS, uno por visibilidad. Con tipo=s3 son
    # todas obligatorias (S3FotoStorageService no arranca sin ellas). El
    # token, solo por entorno y nunca en el repo.
    s3:
      endpoint: ${FOTOS_S3_ENDPOINT:}
      # R2 ignora la region, pero el SDK exige una.
      region: ${FOTOS_S3_REGION:auto}
      bucket-reportes: ${FOTOS_S3_BUCKET_REPORTES:}
      bucket-perfiles: ${FOTOS_S3_BUCKET_PERFILES:}
      access-key-id: ${FOTOS_S3_ACCESS_KEY_ID:}
      secret-access-key: ${FOTOS_S3_SECRET_ACCESS_KEY:}
    # Saneado de cada foto antes de guardarla (DEP-12, ImageIoSaneadorDeImagen):
    # sin EXIF, orientada, <= 2048 px y JPEG 0,85. Cada saneado en curso ocupa
    # unos 25-35 MB de heap; con -Xmx512m, 2 a la vez. Una subida espera turno
    # hasta `espera-maxima` y, si no lo obtiene, recibe 503.
    saneado:
      max-concurrentes: ${FOTOS_SANEADO_MAX_CONCURRENTES:2}
      espera-maxima: 10s
  # Correo saliente (DEP-08): puerto common/port/CorreoSaliente. Todos los
  # correos (recuperacion de contrasena, respuesta de soporte, avisos de
  # cambio de estado) salen por el adaptador elegido aqui:
  #   smtp   -> SmtpCorreoAdapter, con spring.mail (Mailhog, GreenMail)
  #   resend -> ResendCorreoAdapter, POST https://api.resend.com/emails
  # En prod CORREO_TIPO es obligatoria (application-prod.yml).
  correo:
    tipo: ${CORREO_TIPO:smtp}
    # Solo `resend`: clave de la API, SOLO por entorno y nunca en el repo.
    # Con tipo=resend y sin clave, la aplicacion no arranca.
    api-key: ${CORREO_API_KEY:}
    resend:
      # Los de la propuesta aceptada: 3 s para conectar y 10 s para la
      # respuesta. El envio corre en el executor asincrono acotado, fuera de
      # la peticion, asi que esperar mas a Resend no demora a nadie.
      timeout-conexion-segundos: 3
      timeout-lectura-segundos: 10
  # Captcha del registro de cuenta (NC-08): puerto auth/port/VerificadorDeCaptcha,
  # la casilla «No soy un robot» de Google reCAPTCHA v2:
  #   ninguno   -> SinCaptchaAdapter, no se exige ni verifica (desarrollo, tests)
  #   recaptcha -> RecaptchaV2Adapter, POST https://www.google.com/recaptcha/api/siteverify
  # En prod CAPTCHA_TIPO es obligatoria (application-prod.yml).
  captcha:
    tipo: ${CAPTCHA_TIPO:ninguno}
    # Solo `recaptcha`: clave secreta del sitio, SOLO por entorno y nunca en
    # el repo. Con tipo=recaptcha y sin secreto, la aplicacion no arranca.
    secret: ${CAPTCHA_SECRET:}
    recaptcha:
      # La verificacion corre en el hilo de la peticion (fuera de la
      # transaccion): el ciudadano espera, asi que la lectura es mas corta
      # que la de Resend. Sin reintentos.
      timeout-conexion-segundos: 3
      timeout-lectura-segundos: 5
  # Notificaciones al ciudadano (US-16/US-21). El remitente es el de todos
  # los correos (NOTIF_FROM); con Resend, de un dominio verificado.
  notificaciones:
    email-remitente: "${NOTIF_FROM:Ciudad Viva <no-reply@viasegura.pe>}"
    # Suscripciones Web Push (NC-07).
    push:
      # Lista blanca de servicios de push (contra SSRF cuando haya envio
      # real, US-21), separados por coma. "*.dominio" admite subdominios.
      hosts-permitidos: ${PUSH_HOSTS_PERMITIDOS:fcm.googleapis.com,*.push.services.mozilla.com,*.notify.windows.com,web.push.apple.com}
      # Tope de suscripciones por usuario: al superarlo se borra la menos
      # recientemente registrada.
      max-por-usuario: ${PUSH_MAX_POR_USUARIO:10}
      # Envio Web Push real (US-21). Claves VAPID SOLO por entorno, nunca en
      # el repo; formato base64url de `npx web-push generate-vapid-keys`.
      # Sin ellas el canal PUSH queda no disponible y la app arranca igual.
      vapid:
        public-key: ${VAPID_PUBLIC_KEY:}
        private-key: ${VAPID_PRIVATE_KEY:}
        # mailto:... o https://...: contacto para el servicio de push.
        subject: ${VAPID_SUBJECT:}
      # Timeouts cortos: el envio corre en el executor asincrono acotado.
      timeout-conexion-segundos: ${PUSH_TIMEOUT_CONEXION_SEGUNDOS:3}
      timeout-pedido-segundos: ${PUSH_TIMEOUT_PEDIDO_SEGUNDOS:5}
  # Consentimiento (D-12, Ley N.° 29733). Version de los terminos y la
  # politica de privacidad que se exige hoy: el registro y POST
  # /api/auth/me/consentimientos solo aceptan esta. Al publicar un texto
  # nuevo se cambia aqui (y en /privacidad del frontend) y todos los
  # usuarios pasan a debeAceptarTerminos=true sin migrar datos.
  legal:
    version-terminos: ${LEGAL_VERSION_TERMINOS:2026-10-v1}
  # Primer ADMIN de un entorno (DEP-04, AdministradorInicialSeeder). Sin
  # valores por defecto: sin ADMIN_INICIAL_EMAIL no hace nada, y con algun
  # ADMIN en la base tampoco. En una base sin ADMIN crea la cuenta con
  # ADMIN_INICIAL_PASSWORD (12 caracteres o mas y 72 bytes como maximo) y
  # ADMIN_INICIAL_NOMBRE (nombre completo, opcional); si el correo ya tiene
  # cuenta, la app no arranca (nunca la promueve). Despues del primer
  # arranque se borra ADMIN_INICIAL_PASSWORD; las otras dos pueden quedar,
  # porque con un ADMIN creado el seeder no hace nada (README, "Operacion en
  # produccion").
  admin-inicial:
    email: ${ADMIN_INICIAL_EMAIL:}
    password: ${ADMIN_INICIAL_PASSWORD:}
    nombre: ${ADMIN_INICIAL_NOMBRE:}
  # Sugerencia de categoria por la foto (NC-04, D-08): puerto
  # clasificacion/port/ClasificadorDano, con el adaptador elegido aqui:
  #   falso -> FalsoClasificadorAdapter, respuestas fijas (local y tests)
  #   http  -> InferenciaHttpAdapter, el servicio inferencia/ (NC-04b;
  #            produccion), en CLASIFICACION_URL
  # La usan la vista previa (POST /api/clasificaciones) y la sugerencia
  # oficial, que corre despues del commit en el executor asincrono.
  clasificacion:
    tipo: ${CLASIFICACION_TIPO:falso}
    http:
      # URL base del servicio, sin la ruta (el adaptador agrega
      # /v1/detecciones): p. ej. http://inferencia.railway.internal:8000 o,
      # en local, http://localhost:8090. Obligatoria con CLASIFICACION_TIPO=http
      # (ValidacionTipoClasificador); con 'falso' no se mira.
      url: ${CLASIFICACION_URL:}
    # Confianza minima para sugerir (PoliticaDeSugerencia), en (0, 1]. 0.50
    # inicial; se calibra en NC-03b con fotos de Lima.
    umbral: ${CLASIFICACION_UMBRAL:0.50}
    falso:
      # Lo que "detecta" en cualquier foto: vacio = nada (nunca sugiere),
      # 'falla' = el servicio caido, o pares clase:confianza separados por
      # coma ('bache:0.87,grieta:0.30'). En produccion siempre vacio: ahi
      # CLASIFICACION_TIPO=falso apaga la clasificacion.
      respuesta: ${CLASIFICACION_FALSO_RESPUESTA:}
      version-modelo: falso-0
  # Executor asincrono acotado (AsyncConfig): avisos al ciudadano, correos y
  # la sugerencia de categoria (D-08). Con la cola llena la tarea se descarta
  # y se registra; nunca corre en el hilo de la peticion.
  async:
    hilos-base: ${ASYNC_HILOS_BASE:2}
    hilos-max: ${ASYNC_HILOS_MAX:4}
    cola: ${ASYNC_COLA:100}
  # CORS: el frontend es una PWA Next.js desplegada como proyecto
  # independiente, en otro origen. Lista de origenes permitidos separados
  # por coma; en dev, el servidor de desarrollo de Next (puerto 3000).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Parametros de seguridad / JWT (leidos por JwtService)
security:
  jwt:
    # Secreto Base64 de al menos 32 bytes (`openssl rand -base64 48`). SIN
    # valor por defecto a proposito (DEP-01, SEC-03 en el README): con el
    # secreto cualquiera firma un token de ADMIN, y un default versionado
    # dejaba firmando con un secreto publico a todo entorno que olvidara
    # JWT_SECRET. Si falta, JwtService no deja arrancar la aplicacion.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    # El secreto de desarrollo publicado (application-local.yml) solo se
    # acepta con esta bandera en true Y el perfil local o test activado de
    # forma explicita: `local` por defecto no basta (ver JwtService).
    permitir-secreto-de-desarrollo: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
  error:
    include-message: always
  tomcat:
    # DEP-11: cuerpo que Tomcat lee y descarta (sin guardarlo) despues de
    # rechazar una peticion. Con el default (2 MB), una subida de mas de
    # 12 MB (max-request-size) recibia un corte de conexion en vez del 413,
    # y la PWA lo tomaria como error de red y la reintentaria desde la cola
    # offline. Con 32 MB el cliente lee el 413 hasta ese tamano.
    max-swallow-size: 32MB

# Actuator (DEP-02): solo /actuator/health, publico (GET exacto en
# SecurityConfig) para el healthcheck del despliegue. Sin detalles ni
# componentes: no revela que motor de BD ni que versiones corren. Ningun
# otro endpoint se expone por web, ni siquiera a un ADMIN.
management:
  endpoints:
    web:
      exposure:
        include: health
      # Sin la pagina /actuator con enlaces: no hay nada mas que descubrir.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    # Un SMTP caido no debe marcar la app como caida (ni hacer fallar un
    # despliegue): afecta a cada envio de correo, no a la API entera.
    mail:
      enabled: false
