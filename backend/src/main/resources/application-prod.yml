# Perfil PROD (DEP-02): el despliegue del MVP (imagen de backend/Dockerfile,
# que lo activa con SPRING_PROFILES_ACTIVE=prod). Variables en el README,
# seccion "Configuracion de produccion".
#
# Obligatorias y SIN valor por defecto: DB_URL, DB_USERNAME, DB_PASSWORD,
# CORS_ALLOWED_ORIGINS, FOTOS_ALMACEN, CORREO_TIPO, NOTIF_FROM, CAPTCHA_TIPO,
# CLASIFICACION_TIPO, MODERACION_TIPO, ORIGEN_SECRETO y JWT_SECRET (este ultimo desde
# application.yml, SEC-03). Con FOTOS_ALMACEN=s3, tambien FOTOS_S3_* (las valida
# S3FotoStorageService); con FOTOS_ALMACEN=local, FOTOS_DIR (la imagen ya
# trae /data/fotos). Con CORREO_TIPO=resend, tambien CORREO_API_KEY (la
# valida ResendCorreoAdapter). Con CAPTCHA_TIPO=turnstile, tambien
# CAPTCHA_SECRET (la valida TurnstileAdapter). Con CLASIFICACION_TIPO=http,
# tambien CLASIFICACION_URL (la valida ValidacionTipoClasificador). Con
# MODERACION_TIPO=http, tambien MODERACION_URL (la valida ValidacionTipoModeracion).
# Un default aqui arrancaria la app apuntando a algo que no es produccion;
# mejor que no arranque.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    # En una base con tablas pero sin historial de Flyway, fallar en vez de
    # tomarla como linea base y saltarse V1: eso dejaria un esquema a medias.
    baseline-on-migrate: false

app:
  storage:
    # DEP-12: `s3` (R2). Sin default: con el `local` de desarrollo, cada
    # despliegue borraria las fotos del disco del contenedor sin avisar.
    tipo: ${FOTOS_ALMACEN}
    # Solo con FOTOS_ALMACEN=local (un volumen montado en el contenedor).
    fotos-dir: ${FOTOS_DIR}
  cors:
    # Origen(es) de la PWA desplegada (p. ej. https://<proyecto>.vercel.app),
    # separados por coma. Sin default: el de desarrollo no sirve aqui.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  correo:
    # DEP-08: `resend` (Railway bloquea el SMTP saliente). Sin default: con el
    # `smtp` de desarrollo, cada correo fallaria contra localhost:1025 sin
    # que nada lo advierta al desplegar.
    tipo: ${CORREO_TIPO}
  captcha:
    # NC-08b: `turnstile`. Sin default: con el `ninguno` de desarrollo, un
    # despliegue que olvidara la variable dejaria el registro sin captcha sin
    # que nada lo advierta. Para desactivarlo hay que escribir `ninguno`.
    tipo: ${CAPTCHA_TIPO}
    turnstile:
      # Con default a proposito: son los hostnames de la PWA en produccion,
      # y un token resuelto en otro (o con una clave secreta de prueba, que
      # responde example.com) no pasa. CAPTCHA_HOSTNAMES los reemplaza; vacia,
      # no se compara el hostname.
      hostnames: ${CAPTCHA_HOSTNAMES:ciudadviva.app,www.ciudadviva.app}
  clasificacion:
    # NC-04b: `http` (el servicio inferencia/ por la red privada, en
    # CLASIFICACION_URL). Sin default: con el `falso` de desarrollo la
    # clasificacion quedaria apagada sin que nada lo advierta al desplegar
    # (cualquier falla del adaptador tambien termina en «sin sugerencia»).
    # `falso` es el interruptor para apagarla a proposito.
    tipo: ${CLASIFICACION_TIPO}
    falso:
      # Con CLASIFICACION_TIPO=falso, el falso sin detecciones nunca sugiere
      # ni escribe nada: la clasificacion apagada. Literal y no por entorno:
      # una respuesta fija aqui llenaria la base de sugerencias inventadas y
      # arruinaria la evaluacion del modelo (OE3).
      respuesta: ""
  moderacion:
    # NC-10b: `http` (el servicio inferencia/ por la red privada, en
    # MODERACION_URL). Sin default: con el `ninguna` de desarrollo, un
    # despliegue que olvidara la variable publicaria fotos sin revisar sin que
    # nada lo advierta. `ninguna` es el interruptor de emergencia ante una
    # caida larga del servicio (deja un WARN al arrancar). El backend con
    # `http` se despliega despues del servicio con el modelo (DEP-13, NC-10a).
    tipo: ${MODERACION_TIPO}
  dominio-correo:
    # NC-09: el registro consulta el MX del dominio del correo. Con valor por
    # defecto a proposito (no es una variable obligatoria nueva): `dns` es lo
    # que corresponde a produccion y no depende de ninguna clave. Falla
    # abierto si el DNS no responde. DOMINIO_CORREO_TIPO=ninguno la apaga.
    tipo: ${DOMINIO_CORREO_TIPO:dns}
  origen:
    # DEP-14: el secreto que la Transform Rule de Cloudflare agrega en
    # X-Origen-Secreto. Sin default: con el `ninguno` de desarrollo, el API
    # volveria a atender las peticiones que se saltan Cloudflare (su WAF y su
    # limite de peticiones) sin que nada lo advierta. `ninguno` es el
    # interruptor para apagarlo a proposito (deja un WARN al arrancar).
    secreto: ${ORIGEN_SECRETO}
    # Solo durante una rotacion: el secreto viejo, aceptado hasta que la
    # Transform Rule envie el nuevo (README). Vacia fuera de una rotacion.
    secreto-anterior: ${ORIGEN_SECRETO_ANTERIOR:}
  notificaciones:
    # Remitente de todos los correos, de un dominio verificado en Resend
    # (p. ej. "Ciudad Viva <no-reply@<dominio>>"). Sin default: el de
    # desarrollo usa un dominio que no es del proyecto.
    email-remitente: ${NOTIF_FROM}

security:
  jwt:
    # Explicito, aunque ya es el valor de application.yml: en prod nunca se
    # acepta el secreto de desarrollo publicado (SEC-03).
    permitir-secreto-de-desarrollo: false

server:
  # La plataforma inyecta PORT (Railway lo hace); 8080 si no.
  port: ${PORT:8080}
  # Detras del proxy TLS de la plataforma: respeta X-Forwarded-Proto/Host.
  forward-headers-strategy: framework
  # Termina las peticiones en curso antes de apagar (redeploy, escalado).
  shutdown: graceful
  error:
    # Errores que no pasan por GlobalExceptionHandler (los responde el
    # /error de Spring Boot): sin mensaje interno ni traza. Los ApiError del
    # GlobalExceptionHandler conservan su mensaje (PerfilProdIT).
    include-message: never
    include-stacktrace: never

springdoc:
  # OpenAPI y Swagger UI apagados salvo SPRINGDOC_HABILITADO=true (p. ej.
  # en un entorno de pruebas). El contrato se consulta en local.
  api-docs:
    enabled: ${SPRINGDOC_HABILITADO:false}
  swagger-ui:
    enabled: ${SPRINGDOC_HABILITADO:false}

logging:
  level:
    root: INFO
    pe.edu.upc.viasegura: INFO
