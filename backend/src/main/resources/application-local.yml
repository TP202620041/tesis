# Perfil LOCAL: apunta al Postgres+PostGIS de docker-compose.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:viasegura}
    username: ${POSTGRES_USER:viasegura}
    password: ${POSTGRES_PASSWORD:viasegura}
  jpa:
    show-sql: true

# Secreto JWT de DESARROLLO (DEP-01): esta publicado en el repositorio, asi
# que solo sirve en una maquina local. JwtService lo acepta solo si este
# perfil (o test) esta activo de forma EXPLICITA, como lo activa
# `mvn spring-boot:run`; si `local` llega solo por spring.profiles.default
# (un despliegue sin SPRING_PROFILES_ACTIVE), lo rechaza. Exportar
# JWT_SECRET lo reemplaza.
security:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMDEyMzQ1Njc4OQ==}
    permitir-secreto-de-desarrollo: true

logging:
  level:
    pe.edu.upc.viasegura: DEBUG
    org.hibernate.spatial: INFO
