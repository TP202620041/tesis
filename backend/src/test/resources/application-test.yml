# Perfil TEST (lo activa AbstractPostgisIT). La BD, el SMTP y el directorio
# de fotos los fija AbstractPostgisIT con @DynamicPropertySource.
#
# Pool de conexiones (NC-10b): Spring guarda en cache cada contexto de test
# distinto (uno por combinacion de @MockitoBean, perfiles y propiedades), y
# con los valores por defecto de Hikari cada uno retiene 10 conexiones
# ociosas hasta el final de la suite. Con 11 contextos se pasaba del
# max_connections de 100 de PostgreSQL ("too many clients"). Con un minimo
# ocioso de 1 y 10 s de inactividad, un contexto que ya no se usa conserva
# una sola conexion; el maximo sigue en 10, asi que los IT con pedidos
# simultaneos (hasta 6) no esperan conexion.
spring:
  datasource:
    hikari:
      minimum-idle: 1
      idle-timeout: 10000

# Secreto JWT de desarrollo (DEP-01): application.yml ya no trae un valor
# por defecto, y los tests firman sus tokens con este secreto publicado.
# Literal y no ${JWT_SECRET:...}: los tests no deben depender del entorno.
security:
  jwt:
    secret: Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMDEyMzQ1Njc4OQ==
    permitir-secreto-de-desarrollo: true

# Fotos en disco local (DEP-12), literal por la misma razon: un FOTOS_ALMACEN
# del entorno no debe llevar la suite a un bucket. S3FotoStorageServiceIT lo
# cambia a `s3` solo cuando existe FOTOS_S3_TEST_ENDPOINT.
#
# Correo por SMTP (DEP-08), literal por la misma razon: un CORREO_TIPO del
# entorno no debe mandar los correos de la suite a un proveedor real. El SMTP
# es GreenMail (AbstractPostgisIT).
#
# Clasificador falso (NC-04), literal por la misma razon: un
# CLASIFICACION_* del entorno no debe cambiar lo que "detecta" la suite.
# Detecta un bache (0.87) y una grieta (0.30) en cualquier foto: con el umbral
# de 0.50 la sugerencia es siempre «Bache» con 0.870.
# SugerenciaCategoriaFallaIT lo pone en modo 'falla'.
#
# Sin captcha (NC-08), literal por la misma razon: un CAPTCHA_TIPO del entorno
# no debe hacer que la suite llame a Cloudflare. RegistroCaptchaIT exige el
# captcha con un VerificadorDeCaptcha simulado; RegistroTurnstileIT usa el
# adaptador real contra un servidor local.
#
# Sin consulta DNS del dominio del correo (NC-09), literal por la misma razon:
# un DOMINIO_CORREO_TIPO del entorno no debe hacer que la suite dependa de la
# red. RegistroDominioCorreoIT simula el puerto; la lista de desechables se
# aplica igual.
#
# Sin moderacion de fotos (NC-10b), literal por la misma razon: un
# MODERACION_TIPO del entorno no debe hacer que la suite llame al servicio de
# inferencia ni que cada reporte con foto reciba un 503. Los IT de la
# moderacion simulan el puerto ModeradorDeImagen; InferenciaModeracionHttpAdapterIT
# usa el servicio real solo si existe MODERACION_TEST_URL. El filtro de
# groserias del texto corre siempre, con la lista real.
#
# Sin encabezado de origen (DEP-14), literal por la misma razon: un
# ORIGEN_SECRETO del entorno no debe hacer que la suite reciba 403 en cada
# peticion. PerfilProdIT y EncabezadoDeOrigenIT lo encienden con el perfil
# prod (que va despues y gana) y un secreto de prueba.
#
# Primer ADMIN (DEP-04): vacio a proposito, aunque el entorno de quien corre
# los tests defina ADMIN_INICIAL_*. El seeder del contexto no hace nada;
# AdministradorInicialSeederIT lo instancia con los valores de cada caso.
app:
  storage:
    tipo: local
  correo:
    tipo: smtp
    api-key: ""
  captcha:
    tipo: ninguno
    secret: ""
  dominio-correo:
    tipo: ninguno
  clasificacion:
    tipo: falso
    umbral: 0.50
    falso:
      respuesta: "bache:0.87,grieta:0.30"
      version-modelo: falso-0
  moderacion:
    tipo: ninguna
    umbral: 0.70
  origen:
    secreto: ninguno
    secreto-anterior: ""
  admin-inicial:
    email: ""
    password: ""
    nombre: ""
