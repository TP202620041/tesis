# ArchUnit (ver ArquitecturaCapasTest y ARCHITECTURE.md, seccion 4.4).
#
# Almacen de violaciones congeladas: se crea en la primera corrida con las
# violaciones existentes y se versiona en git. Las violaciones nuevas hacen
# fallar el test; las corregidas se retiran del almacen automaticamente.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
