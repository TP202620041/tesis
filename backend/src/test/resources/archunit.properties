# ArchUnit (ver ArquitecturaCapasTest y ARCHITECTURE.md, seccion 4.4).
#
# Almacen de violaciones congeladas: versionado en git desde BE-01. Las
# violaciones nuevas hacen fallar el test; las corregidas se retiran del
# almacen automaticamente (allowStoreUpdate).
# allowStoreCreation=false: si el almacen falta, el test falla en vez de
# recrearlo congelando tambien las violaciones nuevas. Para recongelar tras
# mover una clase: -Darchunit.freeze.refreeze=true (ARCHITECTURE.md 4.4).
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=true
